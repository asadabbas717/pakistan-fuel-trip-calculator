name: Update verified fuel prices
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fuel-prices.yml
      - scripts/fuel-price-parser.cjs
      - scripts/update-fuel-prices.cjs
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fuel-price-update
  cancel-in-progress: false
jobs:
  update:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/fuel-price-parser.test.cjs
      - run: node scripts/update-fuel-prices.cjs
      - name: Publish verified data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel-prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified PSO fuel prices"
            git push
          fi
